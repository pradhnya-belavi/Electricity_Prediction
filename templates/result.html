<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction Result</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .result-box {
      background: #ffffff;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      color: #1e3c72;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .metric-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .metric-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .metric-value {
      font-size: 32px;
      color: #2a5298;
      font-weight: bold;
    }

    .metric-unit {
      font-size: 16px;
      color: #64748b;
      font-weight: normal;
    }

    a.btn-back {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: #2a5298;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      transition: background 0.2s;
    }

    a.btn-back:hover {
      background: #1e3c72;
    }
  </style>
</head>

<body>
  <div class="result-box">
    <h1>⚡ Prediction Result</h1>

    <div class="metric-section">
      <div class="metric-title">Predicted Monthly Usage</div>
      <div class="metric-value">{{ "%.1f"|format(units) }} <span class="metric-unit">kWh (Units)</span></div>
    </div>

    <div class="metric-section">
      <div class="metric-title">Estimated Monthly Bill</div>
      <div class="metric-value">₹ {{ "%.2f"|format(bill) }}</div>
    </div>

    <a href="/" class="btn-back">⬅️ Predict Again</a>
  </div>
</body>
</html>
